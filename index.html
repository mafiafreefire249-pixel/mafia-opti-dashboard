<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mafia Opti+ | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔑</text></svg>">
</head>
<body>
  <div id="login-container">
    <canvas id="particles-canvas"></canvas>
    <div class="login-card">
      <div class="login-logo">Mafia Opti+</div>
      <p class="login-subtitle">Key Management Dashboard</p>
      <form id="login-form">
        <div class="login-input-group">
          <input type="password" id="login-password" placeholder="Enter admin password" autocomplete="current-password" required>
        </div>
        <button type="submit" class="login-btn" id="login-btn">Sign In</button>
        <div class="login-error" id="login-error"></div>
      </form>
    </div>
  </div>

  <script>
    (function() {
      const token = localStorage.getItem('mafia_opti_token');
      if (token) {
        window.location.href = 'panel.html';
        return;
      }

      const canvas = document.getElementById('particles-canvas');
      const ctx = canvas.getContext('2d');
      let particles = [];
      let w, h;
      let animFrame;

      function resize() {
        w = canvas.width = window.innerWidth;
        h = canvas.height = window.innerHeight;
      }

      function createParticles() {
        particles = [];
        const count = Math.floor((w * h) / 12000);
        for (let i = 0; i < count; i++) {
          particles.push({
            x: Math.random() * w,
            y: Math.random() * h,
            vx: (Math.random() - 0.5) * 0.4,
            vy: (Math.random() - 0.5) * 0.4,
            r: Math.random() * 2 + 0.5,
            alpha: Math.random() * 0.5 + 0.1,
            color: ['232,121,249', '168,85,247', '217,70,239'][Math.floor(Math.random() * 3)]
          });
        }
      }

      function drawParticles() {
        ctx.clearRect(0, 0, w, h);

        for (let i = 0; i < particles.length; i++) {
          const p = particles[i];
          p.x += p.vx;
          p.y += p.vy;

          if (p.x < 0) p.x = w;
          if (p.x > w) p.x = 0;
          if (p.y < 0) p.y = h;
          if (p.y > h) p.y = 0;

          ctx.beginPath();
          ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(${p.color},${p.alpha})`;
          ctx.fill();

          for (let j = i + 1; j < particles.length; j++) {
            const p2 = particles[j];
            const dx = p.x - p2.x;
            const dy = p.y - p2.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            if (dist < 120) {
              ctx.beginPath();
              ctx.moveTo(p.x, p.y);
              ctx.lineTo(p2.x, p2.y);
              ctx.strokeStyle = `rgba(168,85,247,${0.08 * (1 - dist / 120)})`;
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        }

        animFrame = requestAnimationFrame(drawParticles);
      }

      resize();
      createParticles();
      drawParticles();

      window.addEventListener('resize', () => {
        resize();
        createParticles();
      });

      const form = document.getElementById('login-form');
      const passwordInput = document.getElementById('login-password');
      const loginBtn = document.getElementById('login-btn');
      const errorEl = document.getElementById('login-error');

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        errorEl.textContent = '';
        const password = passwordInput.value.trim();

        if (!password) {
          errorEl.textContent = 'Please enter a password';
          return;
        }

        loginBtn.disabled = true;
        loginBtn.textContent = 'Signing in...';

        if (password === 'mafia2024') {
          localStorage.setItem('mafia_opti_token', 'admin');
          window.location.href = 'panel.html';
        } else {
          errorEl.textContent = 'Invalid password';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Sign In';
        }
      });

      passwordInput.focus();
    })();
  </script>
</body>
</html>
